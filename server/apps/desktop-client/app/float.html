<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clear Meeting</title>
<style>
  :root{ --brand:#2f6bf6; --ink:#1d2740; --muted:#6b7790; --green:#18a058; --red:#e23b3b; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; background:transparent; overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  .card{ position:relative; margin:8px; height:calc(100% - 16px);
    background:#fff; border:1px solid #e7ecf5; border-radius:16px;
    box-shadow:0 12px 30px rgba(20,30,60,.22); padding:12px 14px;
    display:flex; align-items:center; gap:12px; -webkit-app-region:drag; }
  .logo{ flex:0 0 auto; width:38px; height:38px; border-radius:11px;
    background:linear-gradient(135deg,#3b7bff,var(--brand)); color:#fff;
    display:grid; place-items:center; font-weight:800; font-size:20px;
    box-shadow:0 6px 16px rgba(47,107,246,.35); }
  .body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .brand{ font-size:10px; letter-spacing:.14em; color:var(--muted); font-weight:700; }
  .title{ font-size:14.5px; font-weight:800; color:var(--ink); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .meta{ display:flex; flex-direction:column; align-items:flex-start; gap:3px; font-size:12px; font-weight:600; margin-top:2px; }
  .mic{ display:flex; align-items:center; gap:5px; color:var(--muted); white-space:nowrap; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .mic.on .dot{ background:var(--green); }
  .mic.on{ color:var(--green); }
  .rec{ display:flex; align-items:center; gap:6px; color:var(--red); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .rec .dot{ background:var(--red); animation:pulse 1.4s infinite; }
  .rec.paused{ color:var(--muted); }
  .rec.paused .dot{ background:var(--muted); animation:none; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  .open{ flex:0 0 auto; -webkit-app-region:no-drag; cursor:pointer;
    width:34px; height:34px; border-radius:10px; border:1px solid #e2e8f4; background:#f6f8fc;
    color:var(--brand); display:grid; place-items:center; font-size:16px; }
  .open:hover{ background:var(--brand); color:#fff; border-color:var(--brand); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">C</div>
    <div class="body">
      <div class="brand">CLEAR MEETING</div>
      <div class="title" id="title">Clear Meeting</div>
      <div class="meta">
        <span class="mic" id="mic"><span class="dot"></span><span id="micText">麦克风：未开启</span></span>
        <span class="rec" id="rec"><span class="dot"></span><span id="recText">待开始</span></span>
      </div>
    </div>
    <div class="open" id="open" title="打开主界面">⤢</div>
  </div>
<script>
  const api = window.clearMeetingFloat;
  const $ = (id) => document.getElementById(id);
  function render(s){
    s = s || {};
    $('title').textContent = s.title || 'Clear Meeting';
    const micOn = !!s.micOn;
    $('mic').className = 'mic' + (micOn ? ' on' : '');
    $('micText').textContent = micOn ? '麦克风：已开启' : '麦克风：未开启';
    const rec = $('rec');
    if (s.recording) {
      rec.className = 'rec' + (s.paused ? ' paused' : '');
      $('recText').textContent = (s.paused ? '已暂停 ' : '录音中 ') + (s.elapsedLabel || '00:00:00');
    } else {
      rec.className = 'rec paused';
      $('recText').textContent = '待开始';
    }
  }
  api?.onState(render);
  $('open').addEventListener('click', () => api?.open());
</script>
</body>
</html>
