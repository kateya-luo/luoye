name: Component tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - name: Run server unit tests
        working-directory: server/server
        run: python -m unittest discover -s tests -p 'test_*.py'

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build:web

  firmware-static:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - name: Run firmware static checks
        run: |
          $tests = Get-ChildItem tools/run_*_static_checks.ps1 | Sort-Object Name
          foreach ($test in $tests) {
            Write-Host "RUN $($test.Name)"
            & $test.FullName
            if (-not $?) { throw "$($test.Name) failed" }
          }
